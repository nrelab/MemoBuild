apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: memobuild-redis-queue-scaler
  namespace: memobuild
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memobuild-worker
  minReplicaCount: 1
  maxReplicaCount: 15
  triggers:
  - type: redis
    metadata:
      address: redis://redis-service:6379
      listName: build_tasks:priority:2 # High priority queue
      listLength: "5" # Scale when queue length > 5
  - type: redis
    metadata:
      address: redis://redis-service:6379
      listName: build_tasks:priority:1 # Medium priority queue
      listLength: "10"
  - type: redis
    metadata:
      address: redis://redis-service:6379
      listName: build_tasks:priority:0 # Low priority queue
      listLength: "20"
